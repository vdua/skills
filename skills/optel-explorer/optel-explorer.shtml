<!DOCTYPE html>
<html>
<head>
  <link rel="icon" href="key-round" />
  <title>OpTel Explorer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: inherit;
      background: var(--s2-bg-base, #f5f5f5);
      color: var(--s2-content-default, #222);
      font-size: 14px;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .header h1 {
      font-size: 15px;
      font-weight: 600;
      color: var(--s2-content-default, #222);
    }
    .header p {
      font-size: 12px;
      color: var(--s2-content-secondary, #666);
      margin-top: 2px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
    }
    thead th {
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      color: var(--s2-content-secondary, #888);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 0 8px 8px 8px;
      border-bottom: 1px solid var(--s2-border-default, rgba(0,0,0,0.1));
    }
    tbody tr {
      border-bottom: 1px solid var(--s2-border-default, rgba(0,0,0,0.06));
    }
    tbody tr:last-child { border-bottom: none; }
    tbody td {
      padding: 8px;
      vertical-align: middle;
    }

    input[type="text"], input[type="password"] {
      width: 100%;
      padding: 6px 10px;
      border: 1px solid var(--s2-border-default, rgba(0,0,0,0.2));
      border-radius: 6px;
      background: var(--s2-bg-elevated, #fff);
      color: var(--s2-content-default, #222);
      font-size: 13px;
      outline: none;
    }
    input:focus {
      border-color: var(--s2-accent, #0d66d0);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 5px 12px;
      border-radius: 9999px;
      border: 1px solid transparent;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .btn-primary {
      background: var(--s2-accent, #0d66d0);
      color: var(--s2-gray-25, #fafafa);
      border-color: var(--s2-accent, #0d66d0);
    }
    .btn-secondary {
      background: transparent;
      color: var(--s2-content-default, #222);
      border-color: var(--s2-border-default, rgba(0,0,0,0.2));
    }
    .btn-secondary:hover {
      background: var(--s2-bg-elevated, rgba(0,0,0,0.05));
    }
    .btn-remove {
      background: transparent;
      border: none;
      color: var(--s2-content-secondary, #888);
      padding: 4px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 16px;
      line-height: 1;
    }
    .btn-remove:hover { color: var(--s2-negative, #d7373f); }

    .section-divider {
      border: none;
      border-top: 1px solid var(--s2-border-default, rgba(0,0,0,0.1));
      margin: 20px 0;
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--s2-content-default, #222);
      margin-bottom: 10px;
    }
    .section-detail {
      font-size: 12px;
      color: var(--s2-content-secondary, #888);
      margin-bottom: 10px;
    }

    .row { display: flex; gap: 8px; align-items: center; }

    .empty {
      font-size: 13px;
      color: var(--s2-content-secondary, #888);
      padding: 12px 8px;
      text-align: center;
    }

    .status {
      font-size: 12px;
      padding: 4px 0;
      min-height: 20px;
    }

    .masked {
      color: var(--s2-content-secondary, #aaa);
      letter-spacing: 0.12em;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div>
      <h1>RUM Domain Keys</h1>
      <p>Operational Telemetry key management</p>
    </div>
    <button class="btn btn-secondary" id="btn-refresh" onclick="loadDomains()">Refresh</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Domain</th>
        <th>Key</th>
        <th style="width:40px"></th>
      </tr>
    </thead>
    <tbody id="domain-tbody">
      <tr id="add-row">
        <td><input type="text" id="add-domain" placeholder="example.com" /></td>
        <td><input type="password" id="add-key" placeholder="secret key" /></td>
        <td><button class="btn btn-primary" id="btn-add" onclick="addKey()">Add</button></td>
      </tr>
    </tbody>
  </table>

  <div id="domain-empty" class="empty" style="display:none">No domain keys configured yet</div>

  <div id="gen-section" style="display:none">
    <hr class="section-divider" />
    <p class="section-title">Generate via Adobe</p>
    <p class="section-detail">You are signed in with Adobe. Generate a key automatically.</p>
    <div class="row">
      <input type="text" id="gen-domain" placeholder="example.com" style="flex:1" />
      <button class="btn btn-primary" id="btn-gen" onclick="generateKey()">Generate Key</button>
    </div>
  </div>

  <div id="status-msg" class="status"></div>

<script>
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escJs(s) {
  return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/&/g,'&amp;').replace(/"/g,'&quot;');
}

function renderDomainList(domains) {
  var tbody = document.getElementById('domain-tbody');
  var old = tbody.querySelectorAll('tr.domain-row');
  for (var i = 0; i < old.length; i++) old[i].remove();

  var empty = document.getElementById('domain-empty');
  if (!domains || domains.length === 0) {
    empty.style.display = '';
  } else {
    empty.style.display = 'none';
    for (var j = 0; j < domains.length; j++) {
      var d = domains[j];
      var tr = document.createElement('tr');
      tr.className = 'domain-row';
      tr.innerHTML = '<td>' + escHtml(d) + '</td>'
        + '<td><span class="masked">\u2022\u2022\u2022\u2022\u2022\u2022\u2022\u2022</span></td>'
        + '<td><button class="btn-remove" title="Remove" onclick="removeKey(\'' + escJs(d) + '\')">\u00d7</button></td>';
      tbody.appendChild(tr);
    }
  }
}

function loadDomains() {
  alert('test1')
  var btn = document.getElementById('btn-refresh');
  if (btn) { btn.disabled = true; btn.textContent = '\u2026'; }
  slicc.readFile('/optel/domainkey.json').then(function(text) {
    if (btn) { btn.disabled = false; btn.textContent = 'Refresh'; }
    if (!text || !text.trim()) { renderDomainList([]); return; }
    try {
      renderDomainList(Object.keys(JSON.parse(text)));
    } catch(e) {
      showStatus('Could not parse domainkey.json: ' + e.message, 'error');
      renderDomainList([]);
    }
  }).catch(function() {
    showStatus('Could not load domain keys.', 'error');
    if (btn) { btn.disabled = false; btn.textContent = 'Refresh'; }
    renderDomainList([]);
  });
}

function addKey() {
  var domain = document.getElementById('add-domain').value.trim();
  var key = document.getElementById('add-key').value.trim();
  if (!domain || !key) { showStatus('Enter both domain and key.', 'warn'); return; }
  setLoading('btn-add', true);
  slicc.exec.spawn(['optel-explorer', 'add-domain-key', domain, key]).then(function(r) {
    setLoading('btn-add', false);
    if (r.exitCode === 0) {
      document.getElementById('add-domain').value = '';
      document.getElementById('add-key').value = '';
      loadDomains();
      showStatus('Domain key added.', 'ok');
    } else {
      showStatus(r.stderr || r.stdout || 'Failed to add key.', 'error');
    }
  });
}

function removeKey(domain) {
  slicc.exec.spawn(['optel-explorer', 'remove-domain-key', domain]).then(function(r) {
    if (r.exitCode === 0) {
      loadDomains();
      showStatus('Removed ' + domain + '.', 'ok');
    } else {
      showStatus(r.stderr || r.stdout || 'Could not remove ' + domain, 'error');
    }
  }).catch(function(err) {
    showStatus('Could not remove ' + domain + ': ' + (err && err.message ? err.message : String(err)), 'error');
  });
}

function generateKey() {
  var domain = document.getElementById('gen-domain').value.trim();
  if (!domain) { showStatus('Enter a domain.', 'warn'); return; }
  setLoading('btn-gen', true);
  showStatus('Calling Adobe RUM API for ' + domain + '\u2026', 'info');
  slicc.exec.spawn(['optel-explorer', 'generate', domain]).then(function(r) {
    setLoading('btn-gen', false);
    if (r.exitCode === 0) {
      document.getElementById('gen-domain').value = '';
      loadDomains();
      showStatus('Key generated and saved for ' + domain + '.', 'ok');
    } else {
      showStatus(r.stderr || r.stdout || 'Key generation failed.', 'error');
    }
  });
}

function setLoading(id, on) {
  var b = document.getElementById(id);
  if (b) { b.disabled = on; b.style.opacity = on ? '0.5' : ''; }
}

function showStatus(msg, type) {
  var el = document.getElementById('status-msg');
  var color = type === 'ok' ? 'var(--s2-positive, #1a8a37)'
    : type === 'error' ? 'var(--s2-negative, #d7373f)'
    : type === 'warn' ? 'var(--s2-notice, #cb6f10)'
    : 'var(--s2-content-secondary, #666)';
  el.innerHTML = '<span style="color:' + color + '">' + escHtml(msg) + '</span>';
  clearTimeout(el._t);
  el._t = setTimeout(function() { el.innerHTML = ''; }, 5000);
}

function checkAdobeLogin() {
  slicc.exec('oauth-token adobe 2>/dev/null | head -c 5').then(function(r) {
    if (r.exitCode === 0 && r.stdout && r.stdout.trim().length > 0) {
      document.getElementById('gen-section').style.display = '';
    }
  }).catch(function() {});
}

window.loadDomains = loadDomains;
window.addKey = addKey;
window.removeKey = removeKey;
window.generateKey = generateKey;

loadDomains();
checkAdobeLogin();
</script>
</body>
</html>
